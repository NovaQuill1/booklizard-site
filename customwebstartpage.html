<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Booklizard Control</title>

<style>
    body {
        background-color: #0d0d0d;
        color: #00ff9c;
        font-family: monospace;
        margin: 0;
        padding: 20px;
    }

    h1 {
        border-bottom: 1px solid #00ff9c;
        padding-bottom: 10px;
    }

    .section {
        margin-top: 20px;
    }

    a {
        color: #00ff9c;
        text-decoration: none;
    }

    a:hover {
        text-decoration: underline;
    }

    .box {
        border: 1px solid #00ff9c;
        padding: 10px;
        margin-top: 10px;
    }

    textarea {
        width: 100%;
        height: 100px;
        background: #000;
        color: #00ff9c;
        border: 1px solid #00ff9c;
        font-family: monospace;
    }
</style>
</head>

<body>

<h1>Booklizard Control Panel</h1>

<div class="section">
    <h2>Quick Links</h2>
    <div class="box">
        <p><a href="https://your-booklizard-site.com">Booklizard Site</a></p>
        <p><a href="https://duckduckgo.com">DuckDuckGo</a></p>
        <p><a href="https://proton.me/mail">Proton Mail</a></p>
    </div>
</div>

<div class="section">
    <h2>Tools</h2>
    <div class="box">
        <p>Booklizard Version: v2</p>
        <p>Status: Operational</p>
    </div>
</div>

<div class="section">
    <h2>Scratchpad</h2>
    <div class="box">
        <textarea placeholder="Write notes... (not saved)"></textarea>
    </div>
</div>

<div class="section">
    <h2>Reminder</h2>
    <div class="box">
        <p>✔ Check identity before sessions</p>
        <p>✔ Avoid logging into personal accounts</p>
        <p>✔ Stay anonymous</p>
    </div>
</div>

</body>
</html>
